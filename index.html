<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>Kanban Board</h1>
        <!-- Header controls: search input, priority filter, new column form, and task creation trigger -->
        <div class="header-controls">
            <input type="search" id="search-input" class="search-input" placeholder="Search tasks by title or description..." aria-label="Search tasks">
            <select id="priority-filter" class="filter-select" aria-label="Filter tasks by priority">
                <option value="all" selected>All Priorities</option>
                <option value="high">High Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="low">Low Priority</option>
            </select>
            <form id="add-column-form" class="column-form">
                <input type="text" id="new-column-title" class="column-input" placeholder="New column name..." aria-label="New column name">
                <button type="submit" class="secondary-btn">+ Add Column</button>
            </form>
            <button id="open-modal-btn" class="primary-btn">+ Add New Task</button>
        </div>
    </header>

    <!-- Columns are dynamically rendered here from column state -->
    <main class="kanban-container" id="kanban-container"></main>

    <!-- Task Modal (Used for both creating and editing tasks) -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Create New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required placeholder="Enter task title...">
                </div>
                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Enter task description..."></textarea>
                </div>
                <div class="form-group">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-status">Status</label>
                    <select id="task-status"></select>
                </div>
                <div class="modal-actions">
                    <button type="button" id="close-modal-btn" class="secondary-btn">Cancel</button>
                    <button type="submit" class="primary-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
