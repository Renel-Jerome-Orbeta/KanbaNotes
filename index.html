<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>Kanban Board</h1>
    </header>

    <main class="kanban-container">
    <!-- To Do Column -->
    <section class="kanban-column" id="todo-column">
        <h2>To Do</h2>
        <div class="task-list" data-status="todo"></div>
    </section>

    <!-- In Progress Column -->
    <section class="kanban-column" id="inprogress-column">
        <h2>In Progress</h2>
        <div class="task-list" data-status="inprogress"></div>
    </section>

    <!-- Done Column -->
    <section class="kanban-column" id="done-column">
        <h2>Done</h2>
        <div class="task-list" data-status="done"></div>
    </section>
</main>
    <script src="app.js"></script>
</body>
</html>
