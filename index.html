<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>Kanban Board</h1>
        <!-- Button to trigger the task creation modal -->
        <button id="open-modal-btn" class="primary-btn">+ Add New Task</button>
    </header>

    <main class="kanban-container">
        <!-- To Do Column -->
        <section class="kanban-column" id="todo-column">
            <h2>To Do</h2>
            <div class="task-list" data-status="todo"></div>
        </section>

        <!-- In Progress Column -->
        <section class="kanban-column" id="inprogress-column">
            <h2>In Progress</h2>
            <div class="task-list" data-status="inprogress"></div>
        </section>

        <!-- Done Column -->
        <section class="kanban-column" id="done-column">
            <h2>Done</h2>
            <div class="task-list" data-status="done"></div>
        </section>
    </main>

    <!-- Task Modal (Used for both creating and editing tasks) -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Create New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required placeholder="Enter task title...">
                </div>
                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Enter task description..."></textarea>
                </div>
                <div class="form-group">
                    <label for="task-status">Status</label>
                    <select id="task-status">
                        <option value="todo">To Do</option>
                        <option value="inprogress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" id="close-modal-btn" class="secondary-btn">Cancel</button>
                    <button type="submit" class="primary-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
